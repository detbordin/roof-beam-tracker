<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ติดตามงานคานหลังคา PB</title>
<meta name="theme-color" content="#1d2433">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#dde1e8;--tie:#f59e0b;--pour:#16a34a;--acc:#2563eb}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;flex:none}
h1{font-size:17px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.save{font-size:12px;font-weight:400;color:var(--mut)}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pill{padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{height:8px;border-radius:6px;background:#e7eaf0;overflow:hidden;display:flex;margin-top:6px}
.bar b{display:block;height:100%}
nav{display:flex;gap:4px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;white-space:nowrap;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav .cnt{font-size:11px;opacity:.8;margin-left:4px}
.tools{display:flex;gap:6px;align-items:center;padding:6px 8px;flex:none;flex-wrap:wrap;font-size:13px}
.tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer;color:var(--ink)}
.tools button.on{background:#1d2433;color:#fff;border-color:#1d2433}
.tools .sp{flex:1}
main{flex:1;min-height:0;position:relative}
.scroller{position:absolute;inset:0;overflow:auto;background:#cfd3db;-webkit-overflow-scrolling:touch}
.plan{position:relative;line-height:0}
.plan img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;border:2px solid rgba(37,99,235,.7);background:rgba(37,99,235,.10);border-radius:3px;cursor:pointer;padding:0}
.hs.t{background:rgba(245,158,11,.60);border-color:#b45309}
.hs.p{background:rgba(22,163,74,.62);border-color:#166534}
.hs.sel{outline:3px solid #dc2626;outline-offset:1px;z-index:3}
.hs.pick{outline:3px solid #7c3aed;outline-offset:1px;z-index:3}
.list{position:absolute;inset:0;overflow:auto;padding:8px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fl button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.fl button.on{background:#1d2433;color:#fff;border-color:#1d2433}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);line-height:1.25}
.chip b{font-size:16px;display:block}
.chip small{color:var(--mut);display:block;font-size:11.5px}
.chip.t{background:#fef3c7;border-color:var(--tie)}
.chip.p{background:#dcfce7;border-color:var(--pour)}
.chip.pick{border-color:#7c3aed;box-shadow:0 0 0 2px #7c3aed}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:12px 14px 16px;z-index:20;border-radius:14px 14px 0 0;max-width:560px;margin:0 auto}
.sheet h2{margin:0;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.sheet .meta{color:var(--mut);font-size:13px;margin:2px 0 10px}
.x{border:0;background:#eef0f4;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px}
.row.on.t{border-color:var(--tie);background:#fffbeb}
.row.on.p{border-color:var(--pour);background:#f0fdf4}
.row label{display:flex;align-items:center;gap:10px;flex:1;font-size:16px;font-weight:600;cursor:pointer}
.row input[type=checkbox]{width:26px;height:26px;accent-color:var(--pour)}
.row.t input[type=checkbox]{accent-color:var(--tie)}
.row input[type=date]{font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:8px;min-width:0}
.bulk{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #7c3aed;padding:10px 12px 14px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bulk .b1{flex:1 1 100%;font-weight:700}
.bulk button{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;color:#fff}
.bulk input[type=date]{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px}
.hint{padding:6px 10px;font-size:12.5px;color:var(--mut)}
</style>
</head>

function counts(sec){
  var n=0,t=0,p=0;
  BEAMS.forEach(function(b){if(sec&&b.hot.p!==sec)return;n++;var k=st(b.id);if(k==='p')p++;if(k==='t')t++});
  return{n:n,t:t,p:p};
}

// ---------- render ----------
function paintHeader(){
  var el=document.getElementById('hdr');if(!el)return;
  var c=counts(null);
  el.innerHTML='<h1><span>ติดตามงานคานหลังคา PB</span><span class="save">'+esc(saveMsg)+'</span></h1>'+
  '<div class="sum"><span class="pill">ทั้งหมด '+c.n+' ตัว</span>'+
  '<span class="pill"><i style="background:var(--tie)"></i>ผูกเหล็กแล้ว '+(c.t+c.p)+'</span>'+
  '<span class="pill"><i style="background:var(--pour)"></i>หล่อแล้ว '+c.p+'</span>'+
  '<span class="pill"><i style="background:#9db4e8"></i>ยังไม่ทำ '+(c.n-c.t-c.p)+'</span></div>'+
  '<div class="bar"><b style="background:var(--pour);width:'+(c.p/c.n*100)+'%"></b><b style="background:var(--tie);width:'+(c.t/c.n*100)+'%"></b></div>';
}
function render(){
  var h='<header id="hdr"></header><nav>';
  Object.keys(SECS).forEach(function(k){var c=counts(k);h+='<button data-v="'+k+'" class="'+(view===k?'on':'')+'">'+SECS[k].name+'<span class="cnt">'+(c.t+c.p)+'/'+c.n+'</span></button>'});
  h+='<button data-v="list" class="'+(view==='list'?'on':'')+'">รายการทั้งหมด</button></nav>';
  h+='<div class="tools">';
  if(view!=='list'){h+='<button data-z="-">−</button><button data-z="+">+</button><button data-z="fit">พอดีจอ</button>'}
  h+='<span class="sp"></span><button data-exp>สำรอง</button><button data-imp>นำเข้า</button><input type="file" id="impf" accept=".json,application/json" hidden><button data-multi class="'+(multi?'on':'')+'">เลือกหลายตัว</button></div>';
  h+='<main id="main"></main><div id="panel"></div>';
  $app.innerHTML=h;
  paintHeader();paintMain();paintPanel();
  $app.querySelectorAll('nav [data-v]').forEach(function(b){b.onclick=function(){view=b.dataset.v;location.hash='#sec'+view;sel=null;render()}});
  $app.querySelectorAll('.tools [data-z]').forEach(function(b){b.onclick=function(){var z=b.dataset.z;var sc=document.querySelector('.scroller');var cx=sc?(sc.scrollLeft+sc.clientWidth/2)/sc.scrollWidth:0,cy=sc?(sc.scrollTop+sc.clientHeight/2)/sc.scrollHeight:0;if(z==='-')zoom=Math.max(1,zoom/1.4);else if(z==='+')zoom=Math.min(6,zoom*1.4);else zoom=1;applyZoom();if(sc){sc.scrollLeft=cx*sc.scrollWidth-sc.clientWidth/2;sc.scrollTop=cy*sc.scrollHeight-sc.clientHeight/2}}});
  $app.querySelector('[data-exp]').onclick=exportData;
  $app.querySelector('[data-imp]').onclick=function(){document.getElementById('impf').click()};
  document.getElementById('impf').onchange=function(){if(this.files[0])importData(this.files[0])};
  $app.querySelector('[data-multi]').onclick=function(){multi=!multi;picks={};sel=null;render()};
}
function applyZoom(){var p=document.querySelector('.plan');if(p)p.style.width=(zoom*100)+'%'}
function paintMain(){
  var m=document.getElementById('main');
  if(view==='list'){
    var types=['all'];BEAMS.forEach(function(b){if(types.indexOf(b.t)<0)types.push(b.t)});
    var h='<div class="list"><div class="fl">';
    [['all','ทั้งหมด'],['n','ยังไม่ทำ'],['t','ผูกเหล็กแล้ว'],['p','หล่อแล้ว']].forEach(function(f){h+='<button data-f="'+f[0]+'" class="'+(flt===f[0]?'on':'')+'">'+f[1]+'</button>'});
    h+='</div><div class="fl">';
    types.forEach(function(t){h+='<button data-t="'+t+'" class="'+(typeFlt===t?'on':'')+'">'+(t==='all'?'ทุกชนิด':t)+'</button>'});
    h+='</div><div class="grid">';
    BEAMS.forEach(function(b){
      var k=st(b.id);if(flt!=='all'&&k!==flt)return;if(typeFlt!=='all'&&b.t!==typeFlt)return;
      var s=STATE[b.id]||{};
      h+='<button class="chip '+(k==='n'?'':k)+(picks[b.id]?' pick':'')+'" data-id="'+b.id+'"><b>'+b.id+'</b><small>'+b.t+' · '+b.l+' ม.</small><small>'+(s.p?'หล่อ '+fmt(s.p):s.t?'ผูก '+fmt(s.t):'—')+'</small></button>';
    });
    h+='</div></div>';
    m.innerHTML=h;
    m.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){flt=b.dataset.f;paintMain()}});
    m.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){typeFlt=b.dataset.t;paintMain()}});
    m.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){pickBeam(b.dataset.id)}});
    return;
  }
  var h='<div class="scroller"><div class="plan" style="width:'+(zoom*100)+'%"><img src="'+SECS[view].img+'" alt="แปลนคานหลังคา" draggable="false">';
  BEAMS.forEach(function(b){
    if(b.hot.p!==view)return;var k=st(b.id),q=b.hot,s=STATE[b.id]||{};
    h+='<button class="hs '+(k==='n'?'':k)+(sel===b.id?' sel':'')+(picks[b.id]?' pick':'')+'" data-id="'+b.id+'" style="left:'+q.x+'%;top:'+q.y+'%;width:'+q.w+'%;height:'+q.h+'%" title="'+b.id+' '+b.t+(s.p?' หล่อ '+fmt(s.p):s.t?' ผูก '+fmt(s.t):'')+'"></button>';
  });
  h+='</div></div>';
  m.innerHTML=h;
  m.querySelectorAll('.hs').forEach(function(b){b.onclick=function(){pickBeam(b.dataset.id)}});
}
function pickBeam(id){
  if(multi){if(picks[id])delete picks[id];else picks[id]=1;paintMain();paintPanel();return}
  sel=(sel===id)?null:id;paintMain();paintPanel();
}
function paintPanel(){
  var P=document.getElementById('panel');
  if(multi){
    var ids=Object.keys(picks);
    if(!ids.length){P.innerHTML='<div class="hint">โหมดเลือกหลายตัว: แตะคานที่ต้องการ แล้วกดบันทึกสถานะทีเดียว</div>';return}
    P.innerHTML='<div class="bulk"><div class="b1">เลือกแล้ว '+ids.length+' ตัว: '+esc(ids.join(', '))+'</div>'+
    '<input type="date" id="bd" value="'+todayISO()+'">'+
    '<button id="bt" style="background:var(--tie)">ผูกเหล็กแล้ว</button><button id="bp" style="background:var(--pour)">หล่อแล้ว</button>'+
    '<button id="bc" style="background:#e11d48">ล้างสถานะ</button><button id="bx" style="background:#6b7385">ยกเลิก</button></div>';
    function d(){return document.getElementById('bd').value||todayISO()}
    document.getElementById('bt').onclick=function(){setField(ids,'t',true,d());picks={};render()};
    document.getElementById('bp').onclick=function(){setField(ids,'p',true,d());picks={};render()};
    document.getElementById('bc').onclick=function(){setField(ids,'t',false);setField(ids,'p',false);picks={};render()};
    document.getElementById('bx').onclick=function(){picks={};paintMain();paintPanel()};
    return;
  }
  if(!sel){P.innerHTML='';return}
  var b=BYID[sel],s=STATE[sel]||{};
  P.innerHTML='<div class="sheet"><h2><span>คาน '+b.id+' · '+b.t+'</span><button class="x" id="cl">✕</button></h2>'+
  '<div class="meta">ยาว '+b.l+' ม. · Top '+b.top+(b.d?' · ดีเทล '+b.d+' ('+b.s+')':'')+'</div>'+
  '<div class="row t'+(s.t?' on':'')+'"><label><input type="checkbox" id="ct"'+(s.t?' checked':'')+'>ผูกเหล็กแล้ว</label><input type="date" id="dt" value="'+(s.t||todayISO())+'"></div>'+
  '<div class="row p'+(s.p?' on':'')+'"><label><input type="checkbox" id="cp"'+(s.p?' checked':'')+'>หล่อแล้ว</label><input type="date" id="dp" value="'+(s.p||todayISO())+'"></div></div>';
  document.getElementById('cl').onclick=function(){sel=null;paintMain();paintPanel()};
  function refresh(){paintMain();paintHeader();paintPanel();updateNavCounts()}
  document.getElementById('ct').onchange=function(){setField([sel],'t',this.checked,document.getElementById('dt').value);refresh()};
  document.getElementById('cp').onchange=function(){setField([sel],'p',this.checked,document.getElementById('dp').value);refresh()};
  document.getElementById('dt').onchange=function(){if(document.getElementById('ct').checked){setField([sel],'t',true,this.value);refresh()}};
  document.getElementById('dp').onchange=function(){if(document.getElementById('cp').checked){setField([sel],'p',true,this.value);refresh()}};
}
function updateNavCounts(){
  $app.querySelectorAll('nav [data-v]').forEach(function(b){var k=b.dataset.v;if(!SECS[k])return;var c=counts(k);b.innerHTML=SECS[k].name+'<span class="cnt">'+(c.t+c.p)+'/'+c.n+'</span>'});
}
window.addEventListener('hashchange',function(){var v=(location.hash||'').replace('#sec','');if((SECS[v]||v==='list')&&v!==view){view=v;sel=null;render()}});
render();
})();
</script>
</body>
</html>
