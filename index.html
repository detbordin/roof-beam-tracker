<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2433">
<title>ติดตามงานคานหลังคา PB</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#dde1e8;--tie:#f59e0b;--pour:#16a34a;--acc:#2563eb}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;flex:none}
h1{font-size:17px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.save{font-size:12px;font-weight:400;color:var(--mut)}
.sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.pill{padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar{height:8px;border-radius:6px;background:#e7eaf0;overflow:hidden;display:flex;margin-top:6px}
.bar b{display:block;height:100%}
nav{display:flex;gap:4px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;white-space:nowrap;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav .cnt{font-size:11px;opacity:.8;margin-left:4px}
.tools{display:flex;gap:6px;align-items:center;padding:6px 8px;flex:none;flex-wrap:wrap;font-size:13px}
.tools button,.fp button.sm{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer;color:var(--ink)}
.tools button.on{background:#1d2433;color:#fff;border-color:#1d2433}
.tools .sp{flex:1}
.lgd{display:flex;gap:5px;padding:0 8px 6px;flex-wrap:wrap;flex:none;font-size:12px}
.lgd:empty{display:none}
.fp{flex:none;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;max-height:42vh;overflow:auto;font-size:13px}
.fp .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.fp .r>span.lb{color:var(--mut);min-width:54px}
.fp button.c{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.fp button.c.on{background:#1d2433;color:#fff;border-color:#1d2433}
.fp input[type=date]{font:inherit;padding:4px 5px;border:1px solid var(--line);border-radius:8px;min-width:0;max-width:150px}
.fp .res{font-weight:700;color:var(--acc)}
main{flex:1;min-height:0;position:relative}
.scroller{position:absolute;inset:0;overflow:auto;background:#cfd3db;-webkit-overflow-scrolling:touch}
.plan{position:relative;line-height:0;margin-bottom:230px}
.plan img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;border:2px solid rgba(37,99,235,.7);background:rgba(37,99,235,.10);border-radius:3px;cursor:pointer;padding:0}
.hs.t{background:rgba(245,158,11,.60);border-color:#b45309}
.hs.p{background:rgba(22,163,74,.62);border-color:#166534}
.hs.w{background:rgba(139,92,246,.62);border-color:#5b21b6}
.hs.u{background:rgba(236,72,153,.55);border-color:#9d174d}
.hs.i{background:rgba(6,182,212,.62);border-color:#0e7490}
.hs.dim{opacity:.18}
.ovw .hs:not(.t):not(.p):not(.w):not(.u):not(.i){background:transparent;border-width:1px;border-color:rgba(37,99,235,.22)}
.hs.nt::after{content:"";position:absolute;right:-5px;top:-5px;width:11px;height:11px;border-radius:50%;background:#e11d48;border:2px solid #fff}
.hs.sel{outline:3px solid #dc2626;outline-offset:1px;z-index:3}
.hs.pick{outline:3px dashed #111;outline-offset:1px;z-index:3}
.list{position:absolute;inset:0;overflow:auto;padding:8px 8px 240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);line-height:1.25;position:relative}
.chip b{font-size:16px;display:block}
.chip small{color:var(--mut);display:block;font-size:11.5px}
.chip.t{background:#fef3c7;border-color:var(--tie)}
.chip.p{background:#dcfce7;border-color:var(--pour)}
.chip.w{background:#ede9fe;border-color:#8b5cf6}
.chip.u{background:#fce7f3;border-color:#ec4899}
.chip.i{background:#cffafe;border-color:#06b6d4}
.chip.pick{border-color:#111;box-shadow:0 0 0 2px #111}
.chip .note{color:#9f1239;font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:30px;text-align:center;color:var(--mut)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:12px 14px calc(14px + env(safe-area-inset-bottom));z-index:20;border-radius:14px 14px 0 0;max-width:560px;margin:0 auto;max-height:80dvh;overflow:auto}
.sheet h2{margin:0;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.sheet .meta{color:var(--mut);font-size:13px;margin:2px 0 10px}
.x{border:0;background:#eef0f4;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px}
.row.on.t{border-color:var(--tie);background:#fffbeb}
.row.on.p{border-color:var(--pour);background:#f0fdf4}
.row.on.w{border-color:#8b5cf6;background:#f5f3ff}
.row.on.u{border-color:#ec4899;background:#fdf2f8}
.row.on.i{border-color:#06b6d4;background:#ecfeff}
.row.i input[type=checkbox]{accent-color:#06b6d4}
.row.u input[type=checkbox]{accent-color:#ec4899}
.day .bs button.u{border-color:#ec4899;background:#fce7f3}
.day .bs button.i{border-color:#06b6d4;background:#cffafe}
.row.w input[type=checkbox]{accent-color:#8b5cf6}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.day h3{margin:0 0 2px;font-size:16px}
.day .sub{color:var(--mut);font-size:12.5px;margin-bottom:8px}
.day .bs{display:flex;flex-wrap:wrap;gap:5px}
.day .bs button{border:2px solid #8b5cf6;background:#ede9fe;border-radius:8px;padding:4px 9px;font:inherit;cursor:pointer;color:var(--ink)}
.day .bs button.p{border-color:var(--pour);background:#dcfce7}
.day .bs button.t{border-color:var(--tie);background:#fef3c7}
.day .bs button.n{border-color:var(--line);background:#fff}
.bulk .q{background:#eef0f4!important;color:var(--ink)!important;padding:6px 9px!important;font-weight:500!important;font-size:13px}
.ver{font-size:11px;color:var(--mut);margin-top:4px}
.row label{display:flex;align-items:center;gap:10px;flex:1;font-size:16px;font-weight:600;cursor:pointer}
.row input[type=checkbox]{width:26px;height:26px;accent-color:var(--pour)}
.row.t input[type=checkbox]{accent-color:var(--tie)}
.row input[type=date]{font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:8px;min-width:0}
.sheet textarea{width:100%;min-height:64px;font:inherit;font-size:15px;padding:8px;border:2px solid var(--line);border-radius:12px;resize:vertical}
.sheet .nl{font-size:13px;color:var(--mut);margin:4px 0 4px}
.bulk{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #111;padding:10px 12px calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bulk .b1{flex:1 1 100%;font-weight:700}
.bulk button{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;color:#fff}
.bulk input[type=date]{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px}
.hint{padding:6px 10px;font-size:12.5px;color:var(--mut)}
#printRoot{display:none}
.rp{font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;color:#111;font-size:11pt}
.rp h1{font-size:18pt;margin:0 0 2mm}
.rp h2{font-size:14pt;margin:0 0 3mm}
.rp .sub{color:#555;font-size:10pt;margin-bottom:4mm}
.rp-page{page-break-after:always;break-after:page}
.rp-page:last-child{page-break-after:auto;break-after:auto}
.rp table{border-collapse:collapse;width:100%;font-size:9pt}
.rp th,.rp td{border:1px solid #999;padding:.7mm 2mm;text-align:left}
.rp th{background:#e3e7ee}
.rp thead{display:table-header-group}
.rp tr{page-break-inside:avoid;break-inside:avoid}
.rp tr.p td.st{background:#bbf7d0}.rp tr.t td.st{background:#fde68a}.rp tr.w td.st{background:#ddd6fe}.rp tr.u td.st{background:#fbcfe8}.rp tr.i td.st{background:#a5f3fc}
.rp .lgn{display:flex;gap:6mm;margin:3mm 0 4mm;font-size:10pt}
.rp .lgn i{display:inline-block;width:4mm;height:4mm;margin-right:1.5mm;vertical-align:-0.8mm;border:1px solid #666}
.rp .plan{margin:0 auto;width:232mm}
.rp .plan .hs{cursor:default}
.rp .plan .hs:not(.t):not(.p):not(.w):not(.u):not(.i){background:transparent;border-color:transparent}
.rp .plan .hs{border-width:1px}
.rp .big td{font-size:11pt}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{height:auto!important;background:#fff!important}
  #app{display:none!important}
  #printRoot{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:520px){h1{font-size:15px}.tools button{padding:5px 8px}}
</style>
</head>

    parts.push(new Uint8Array(lh.buffer),nm,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x5821,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  });
  var cdsz=0;cd.forEach(function(p){cdsz+=p.length});
  var e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdsz,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cd,[new Uint8Array(e.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ---------- logic ----------
function clean(id){var s=STATE[id];if(s&&!s.t&&!s.p&&!s.w&&!s.u&&!s.i&&!s.n)delete STATE[id]}
function setField(ids,field,on,date){
  ids.forEach(function(id){
    var s=STATE[id]||(STATE[id]={});
    if(on){s[field]=date||todayISO();if(field==='p'&&!s.t)s.t=s.p;if(field==='i'){if(!s.p)s.p=s.i;if(!s.t)s.t=s.p}}
    else{delete s[field];if(field==='p')delete s.i}
    clean(id);
  });
  changed();
}
function setNote(id,txt){var s=STATE[id]||(STATE[id]={});txt=txt.replace(/\s+$/,'');if(txt)s.n=txt;else delete s.n;clean(id);changed()}
function counts(sec){
  var n=0,t=0,p=0,w=0,u=0,i=0,wv=0,wl=0;
  BEAMS.forEach(function(b){if(sec&&b.hot.p!==sec)return;n++;var s=STATE[b.id]||{};if(s.i)i++;if(s.p||s.i)p++;else{if(s.t)t++;else if(s.u)u++;if(s.w){w++;wv+=vol(b);wl+=b.l}}});
  return{n:n,t:t,p:p,w:w,u:u,i:i,wv:wv,wl:wl};
}
function fActive(){return F.status!=='all'||F.type!=='all'||F.from||F.to||F.note}
function match(b){
  var s=STATE[b.id]||{};
  if(F.status!=='all'&&st(b.id)!==F.status)return false;
  if(F.type!=='all'&&b.t!==F.type)return false;
  if(F.note&&!s.n)return false;
  if(F.from||F.to){var d=s[F.kind];if(!d)return false;if(F.from&&d<F.from)return false;if(F.to&&d>F.to)return false}
  return true;
}

    arr.forEach(function(b){h+='<button data-id="'+b.id+'" class="i">'+b.id+' <small>'+b.t+'</small></button>'});
    h+='</div></div>'});
  h+='<div class="hint">ปริมาตรคำนวณจาก กว้าง×ลึก×ยาว ตามหน้าตัดในแบบ (PB5/PB5C 0.20×0.50 ม. ชนิดอื่น 0.20×0.40 ม.) เป็นค่าประมาณ ไม่ได้หักรอยต่อกับเสา</div></div>';
  return h;
}
function spot(b,q){
  var k=st(b.id),s=STATE[b.id]||{},act=fActive();
  return '<button class="hs '+(k==='n'?'':k)+(s.n?' nt':'')+(act&&!match(b)?' dim':'')+(sel===b.id?' sel':'')+(picks[b.id]?' pick':'')+'" data-id="'+b.id+'" style="left:'+q.x+'%;top:'+q.y+'%;width:'+q.w+'%;height:'+q.h+'%" title="'+b.id+' '+b.t+(s.i?' ติดตั้ง '+fmt(s.i):s.p?' หล่อ '+fmt(s.p):s.w?' แผนหล่อ '+fmt(s.w):s.t?' ผูก '+fmt(s.t):s.u?' แผนผูก '+fmt(s.u):'')+(s.n?' — '+esc(s.n):'')+'"></button>';
}
function pickBeam(id){
  if(multi){if(picks[id])delete picks[id];else picks[id]=1;paintMain();paintPanel();return}
  sel=(sel===id)?null:id;paintMain();paintPanel();
}
function afterEdit(){paintMain();paintHeader();paintNav();if(showF)paintFilter()}
function paintPanel(){
  var P=document.getElementById('panel');
  if(multi&&view!=='plan'){
    var ids=Object.keys(picks);var bl=0,bv=0;ids.forEach(function(i){var q=BYID[i];if(q){bl+=q.l;bv+=vol(q)}});
    if(!ids.length){P.innerHTML='<div class="hint">โหมดเลือกหลายตัว: แตะคานที่ต้องการ แล้วกดบันทึกสถานะทีเดียว</div>';return}
    P.innerHTML='<div class="bulk"><div class="b1">เลือกแล้ว '+ids.length+' ตัว · ยาวรวม '+bl.toFixed(2)+' ม. · คอนกรีต '+bv.toFixed(2)+' ลบ.ม.<br><span style="font-weight:400;font-size:13px">'+esc(ids.join(', '))+'</span></div>'+
    '<input type="date" id="bd" value="'+todayISO()+'"><button class="q" id="q0">วันนี้</button><button class="q" id="q1">พรุ่งนี้</button>'+
    '<button id="bu" style="background:#ec4899">วางแผนผูกเหล็ก</button><button id="bt" style="background:var(--tie)">ผูกเหล็กแล้ว</button><button id="bw" style="background:#8b5cf6">วางแผนหล่อ</button><button id="bp" style="background:var(--pour)">หล่อแล้ว</button><button id="bi" style="background:#06b6d4">ติดตั้งแล้ว</button>'+
    '<button id="bc" style="background:#e11d48">ล้างสถานะ</button><button id="bx" style="background:#6b7385">ยกเลิก</button></div>';
    var d=function(){return document.getElementById('bd').value||todayISO()};
    document.getElementById('q0').onclick=function(){document.getElementById('bd').value=todayISO()};
    document.getElementById('q1').onclick=function(){document.getElementById('bd').value=tomorrowISO()};
    document.getElementById('bt').onclick=function(){setField(ids,'t',true,d());picks={};refreshAll()};
    document.getElementById('bu').onclick=function(){setField(ids,'u',true,d());picks={};refreshAll()};
    document.getElementById('bw').onclick=function(){setField(ids,'w',true,d());picks={};refreshAll()};
    document.getElementById('bp').onclick=function(){setField(ids,'p',true,d());picks={};refreshAll()};
    document.getElementById('bi').onclick=function(){setField(ids,'i',true,d());picks={};refreshAll()};
    document.getElementById('bc').onclick=function(){if(!confirm('ล้างสถานะทั้งหมด (แผนผูก/ผูก/แผนหล่อ/หล่อ/ติดตั้ง) ของ '+ids.length+' ตัว?'))return;setField(ids,'t',false);setField(ids,'u',false);setField(ids,'w',false);setField(ids,'p',false);setField(ids,'i',false);picks={};refreshAll()};
    document.getElementById('bx').onclick=function(){picks={};paintMain();paintPanel()};
    return;
  }
  if(!sel){P.innerHTML='';return}
  var b=BYID[sel],s=STATE[sel]||{};
  P.innerHTML='<div class="sheet"><h2><span>คาน '+b.id+' · '+b.t+'</span><button class="x" id="cl">✕</button></h2>'+
  '<div class="meta">ยาว '+b.l+' ม. · Top '+b.top+(b.d?' · ดีเทล '+b.d+' ('+b.s+')':'')+'<br>ปริมาตรคอนกรีต '+vol(b).toFixed(3)+' ลบ.ม. ('+dims(b)+' ม.)</div>'+
  '<div class="row u'+(s.u?' on':'')+'"><label><input type="checkbox" id="cu"'+(s.u?' checked':'')+'>วางแผนผูกเหล็ก</label><input type="date" id="du" value="'+(s.u||tomorrowISO())+'"></div>'+
  '<div class="row t'+(s.t?' on':'')+'"><label><input type="checkbox" id="ct"'+(s.t?' checked':'')+'>ผูกเหล็กแล้ว</label><input type="date" id="dt" value="'+(s.t||todayISO())+'"></div>'+
  '<div class="row w'+(s.w?' on':'')+'"><label><input type="checkbox" id="cw"'+(s.w?' checked':'')+'>วางแผนหล่อ</label><input type="date" id="dw" value="'+(s.w||tomorrowISO())+'"></div>'+
  '<div class="row p'+(s.p?' on':'')+'"><label><input type="checkbox" id="cp"'+(s.p?' checked':'')+'>หล่อแล้ว</label><input type="date" id="dp" value="'+(s.p||todayISO())+'"></div>'+
  '<div class="row i'+(s.i?' on':'')+'"><label><input type="checkbox" id="ci"'+(s.i?' checked':'')+'>ติดตั้งแล้ว</label><input type="date" id="di" value="'+(s.i||todayISO())+'"></div>'+
  '<div class="nl">หมายเหตุ</div><textarea id="nt" placeholder="เช่น เหล็กขาด แก้แบบ รอตรวจ ฯลฯ">'+esc(s.n||'')+'</textarea></div>';
  var cur=sel;
  document.getElementById('cl').onclick=function(){sel=null;paintMain();paintPanel()};
  var refresh=function(){afterEdit();paintPanel()};
  document.getElementById('ct').onchange=function(){setField([cur],'t',this.checked,document.getElementById('dt').value);refresh()};
  document.getElementById('cu').onchange=function(){setField([cur],'u',this.checked,document.getElementById('du').value);refresh()};
  document.getElementById('du').onchange=function(){if(document.getElementById('cu').checked){setField([cur],'u',true,this.value);refresh()}};
  document.getElementById('cw').onchange=function(){setField([cur],'w',this.checked,document.getElementById('dw').value);refresh()};
  document.getElementById('dw').onchange=function(){if(document.getElementById('cw').checked){setField([cur],'w',true,this.value);refresh()}};
  document.getElementById('cp').onchange=function(){setField([cur],'p',this.checked,document.getElementById('dp').value);refresh()};
  document.getElementById('dt').onchange=function(){if(document.getElementById('ct').checked){setField([cur],'t',true,this.value);refresh()}};
  document.getElementById('dp').onchange=function(){if(document.getElementById('cp').checked){setField([cur],'p',true,this.value);refresh()}};
  document.getElementById('ci').onchange=function(){setField([cur],'i',this.checked,document.getElementById('di').value);refresh()};
  document.getElementById('di').onchange=function(){if(document.getElementById('ci').checked){setField([cur],'i',true,this.value);refresh()}};
  var nt=document.getElementById('nt'),tm=null;
  nt.oninput=function(){setNote(cur,nt.value);clearTimeout(tm);tm=setTimeout(afterEdit,600)};
  nt.onblur=function(){afterEdit()};
}
window.addEventListener('hashchange',function(){var v=(location.hash||'').replace('#sec','');if((SECS[v]||v==='list'||v==='all'||v==='plan')&&v!==view){view=v;sel=null;render()}});
render();
})();
</script>
</body>
